name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the runtime in apps/web/Dockerfile and apps/worker/Dockerfile.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restoring the Next build cache keeps the build step from recompiling
      # everything on every run. The key changes whenever sources change, so a
      # stale cache is never used for more than a warm start.
      - name: Restore the Next build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'packages/**/*.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # The four steps below run even when an earlier one fails, so a single run
      # reports every problem instead of one per round trip. Any failure still
      # fails the job.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
