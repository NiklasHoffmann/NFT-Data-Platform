services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:?}
      MONGODB_URI: ${MONGODB_URI:?}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-nft_data_platform}
      REDIS_URL: ${REDIS_URL:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_MAX_REQUEST_BYTES: ${API_MAX_REQUEST_BYTES:-1048576}
      PUBLIC_READ_RATE_LIMIT_PER_MINUTE: ${PUBLIC_READ_RATE_LIMIT_PER_MINUTE:-180}
      RPC_URL_1: ${RPC_URL_1:-}
      RPC_URL_10: ${RPC_URL_10:-}
      RPC_URL_137: ${RPC_URL_137:-}
      RPC_URL_8453: ${RPC_URL_8453:-}
      RPC_URL_42161: ${RPC_URL_42161:-}
      RPC_URL_7777777: ${RPC_URL_7777777:-}
      RPC_URL_11155111: ${RPC_URL_11155111:-}
      RPC_URL_84532: ${RPC_URL_84532:-}
      RPC_URL_80002: ${RPC_URL_80002:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-nft-media}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?}
      API_CLIENT_SECRET_ENCRYPTION_KEY: ${API_CLIENT_SECRET_ENCRYPTION_KEY:?}
      API_BOOTSTRAP_CLIENT_ID: ${API_BOOTSTRAP_CLIENT_ID:?}
      API_BOOTSTRAP_KEY: ${API_BOOTSTRAP_KEY:?}
      API_BOOTSTRAP_SECRET: ${API_BOOTSTRAP_SECRET:?}
      API_BOOTSTRAP_SCOPES: ${API_BOOTSTRAP_SCOPES:?}
      API_BOOTSTRAP_RATE_LIMIT_PER_MINUTE: ${API_BOOTSTRAP_RATE_LIMIT_PER_MINUTE:-300}
      API_BOOTSTRAP_ALLOWED_IPS: ${API_BOOTSTRAP_ALLOWED_IPS:-}
      AUTH_MAX_TIMESTAMP_SKEW_SEC: ${AUTH_MAX_TIMESTAMP_SKEW_SEC:-300}
      TOKEN_METADATA_TTL_SECONDS: ${TOKEN_METADATA_TTL_SECONDS:-86400}
      TOKEN_METADATA_FAILURE_RETRY_SECONDS: ${TOKEN_METADATA_FAILURE_RETRY_SECONDS:-21600}
      READ_REVALIDATION_ENABLED: ${READ_REVALIDATION_ENABLED:-true}
      READ_REVALIDATION_DEBOUNCE_SECONDS: ${READ_REVALIDATION_DEBOUNCE_SECONDS:-300}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - "3000"
    networks:
      - public

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:?}
      MONGODB_URI: ${MONGODB_URI:?}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-nft_data_platform}
      RPC_URL_1: ${RPC_URL_1:-}
      RPC_URL_10: ${RPC_URL_10:-}
      RPC_URL_137: ${RPC_URL_137:-}
      RPC_URL_8453: ${RPC_URL_8453:-}
      RPC_URL_42161: ${RPC_URL_42161:-}
      RPC_URL_7777777: ${RPC_URL_7777777:-}
      RPC_URL_11155111: ${RPC_URL_11155111:-}
      RPC_URL_84532: ${RPC_URL_84532:-}
      RPC_URL_80002: ${RPC_URL_80002:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-nft-media}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-25000000}
      CHAIN_INDEXING_ENABLED: ${CHAIN_INDEXING_ENABLED:-false}
      CHAIN_INDEXING_POLL_INTERVAL_MS: ${CHAIN_INDEXING_POLL_INTERVAL_MS:-30000}
      CHAIN_INDEXING_BATCH_SIZE: ${CHAIN_INDEXING_BATCH_SIZE:-10}
      CHAIN_INDEXING_MAX_BLOCK_RANGE: ${CHAIN_INDEXING_MAX_BLOCK_RANGE:-2000}
      CHAIN_INDEXING_COLLECTION_ALLOWLIST: ${CHAIN_INDEXING_COLLECTION_ALLOWLIST:-}
      METADATA_SWEEP_ENABLED: ${METADATA_SWEEP_ENABLED:-false}
      METADATA_SWEEP_INTERVAL_MS: ${METADATA_SWEEP_INTERVAL_MS:-60000}
      METADATA_SWEEP_BATCH_SIZE: ${METADATA_SWEEP_BATCH_SIZE:-25}
      TOKEN_METADATA_TTL_SECONDS: ${TOKEN_METADATA_TTL_SECONDS:-86400}
      TOKEN_METADATA_FAILURE_RETRY_SECONDS: ${TOKEN_METADATA_FAILURE_RETRY_SECONDS:-21600}
      COLLECTION_METADATA_TTL_SECONDS: ${COLLECTION_METADATA_TTL_SECONDS:-604800}
      API_CLIENT_SECRET_ENCRYPTION_KEY: ${API_CLIENT_SECRET_ENCRYPTION_KEY:?}
      API_BOOTSTRAP_CLIENT_ID: ${API_BOOTSTRAP_CLIENT_ID:?}
      API_BOOTSTRAP_KEY: ${API_BOOTSTRAP_KEY:?}
      API_BOOTSTRAP_SECRET: ${API_BOOTSTRAP_SECRET:?}
      API_BOOTSTRAP_SCOPES: ${API_BOOTSTRAP_SCOPES:?}
      API_BOOTSTRAP_RATE_LIMIT_PER_MINUTE: ${API_BOOTSTRAP_RATE_LIMIT_PER_MINUTE:-300}
      API_BOOTSTRAP_ALLOWED_IPS: ${API_BOOTSTRAP_ALLOWED_IPS:-}
    networks:
      - public

networks:
  public:
